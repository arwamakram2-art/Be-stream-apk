name: Build BE STREAM APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Build Cordova Android APK
      run: |
        npm install -g cordova --force
        cordova telemetry off
        cordova create app com.bestream.player "BE STREAM 4K" --no-telemetry
        if [ -d "www" ]; then cp -rf www/* app/www/; fi
        if [ -f "index.html" ]; then cp -f index.html app/www/index.html; fi
        if [ -f "config.xml" ]; then cp -f config.xml app/config.xml; fi
        cd app
        cordova platform add android@13.0.0 --no-telemetry
        cordova build android --debug --no-telemetry

    - name: Upload BE STREAM APK
      uses: actions/upload-artifact@v4
      with:
        name: BE-STREAM-4K-APK
        path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
